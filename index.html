<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS + DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>

    <title>Mappa Terremoti 🌍</title>
  </head>
  <body class="m-0 p-0 h-screen w-full overflow-hidden">
    <div id="map" class="h-screen w-full z-[1]"></div>
    <!-- Sidebar dei filtri -->
    <div class="drawer drawer-end z-[1000]" id="sidebar-filtri">
      <input id="sidebar-drawer" type="checkbox" class="drawer-toggle" />
      <div class="drawer-content">
        <!-- Pulsante per aprire la sidebar -->
        <label
          for="sidebar-drawer"
          class="btn btn-primary drawer-button fixed top-4 right-4 shadow-lg"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16"
            />
          </svg>
          Filtri
        </label>
      </div>
      <div class="drawer-side">
        <label
          for="sidebar-drawer"
          aria-label="close sidebar"
          class="drawer-overlay"
        ></label>
        <div
          class="menu bg-base-100 text-base-content min-h-full w-80 p-6 shadow-xl"
        >
          <h2 class="text-2xl font-bold mb-6 text-primary">Terremoti</h2>

          <!-- Contatore -->
          <div class="stats shadow mb-6 bg-primary text-primary-content">
            <div class="stat">
              <div class="stat-title text-primary-content opacity-70">
                Terremoti visualizzati
              </div>
              <div class="stat-value" id="contatore">0</div>
              <div class="stat-desc text-primary-content opacity-70">
                Totale sulla mappa
              </div>
            </div>
          </div>

          <!-- Magnitudo minima -->
          <div class="form-control mb-6">
            <label class="label">
              <span class="label-text font-semibold text-lg"
                >Magnitudo minima</span
              >
              <span
                class="label-text-alt badge badge-secondary"
                id="minMagValue"
                >0</span
              >
            </label>
            <input
              id="minMag"
              type="range"
              min="0"
              max="13"
              step="0.5"
              value="0"
              class="range range-primary"
            />
          </div>

          <!-- Magnitudo massima -->
          <div class="form-control mb-6">
            <label class="label">
              <span class="label-text font-semibold text-lg"
                >Magnitudo massima</span
              >
              <span
                class="label-text-alt badge badge-secondary"
                id="maxMagValue"
                >13</span
              >
            </label>
            <input
              id="maxMag"
              type="range"
              min="0"
              max="13"
              step="0.5"
              value="13"
              class="range range-primary"
            />
          </div>

          <div class="divider"></div>

          <!-- Pulsante Reset -->
          <button id="reset" class="btn btn-error btn-block shadow-lg">
            Reset Database
          </button>
        </div>
      </div>
    </div>

    <!-- Modale di inserimento magnitudo -->
    <dialog id="modalMagnitudo" class="modal">
      <div class="modal-box">
        <h3 class="font-bold text-lg mb-4">Nuovo Terremoto</h3>
        <p class="mb-4">Inserisci i dettagli del terremoto:</p>

        <div class="form-control mb-4">
          <label class="label">
            <span class="label-text">Magnitudo</span>
            <span class="label-text-alt" id="magnitudoValue">5.0</span>
          </label>
          <input
            id="inputMagnitudo"
            type="range"
            min="0"
            max="13"
            step="0.1"
            value="5.0"
            class="range range-primary"
          />
        </div>

        <div class="form-control mb-4">
          <label class="label"
            ><span class="label-text">Nome località</span></label
          >
          <input
            id="inputPlace"
            type="text"
            value="Punto utente"
            class="input input-bordered input-primary"
          />
        </div>

        <div class="modal-action">
          <button id="btnAnnulla" class="btn btn-ghost">Annulla</button>
          <button id="btnConferma" class="btn btn-primary">Conferma</button>
        </div>
      </div>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
